<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout reach under a notch/home indicator,
         which the env(safe-area-inset-*) padding in the stylesheets then pads
         back out. No maximum-scale: pinch-zoom stays available for anyone who
         needs it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Happiness Cloud</title>
    <!-- Poppins for Gurudev's quote. Preconnect so it lands quickly; the
         stacks in EventHeading.css and SubmitView.css fall back to the system
         UI font if the venue's network is slow or blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
